# Mindlap EMR Nginx Site Configuration for AWS EC2 Ubuntu

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect all HTTP traffic to HTTPS (Certbot will automate this)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL Certificates managed by Certbot / Let's Encrypt
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Maximum upload size for client documents (e.g. 25 MB)
    client_max_body_size 25M;

    # Frontend Single Page App (React Production Build)
    location / {
        root /var/www/mindlap/frontend/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Django REST Framework API Requests Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Static Files
    location /static/ {
        alias /var/www/mindlap/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Uploaded Media Files
    location /media/ {
        alias /var/www/mindlap/backend/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
