version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mindlap_postgres
    restart: always
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-mindlap_db}
      POSTGRES_USER: ${DB_USER:-mindlap_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mindlap_secure_password_2026}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mindlap_user} -d ${DB_NAME:-mindlap_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: mindlap_backend
    restart: always
    env_file:
      - ./backend/.env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python init_production_db.py &&
             gunicorn mindlap_backend.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: mindlap_frontend
    restart: always
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
  backend_static:
